<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>문화제 진행자 화면</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <div class="container">

    <h1>문화제 진행자 화면</h1>


    <h2>
      현재:
      <span id="current-question">
        1번 문제
      </span>
    </h2>


    <button id="previous-button">
      이전 문제
    </button>


    <button id="next-button">
      다음 문제
    </button>


    <button id="refresh-button">
      현황 새로고침
    </button>


    <button id="ranking-button">
      최종 순위
    </button>


    <h2 id="table-title">
      현재 문제 현황
    </h2>


    <div class="table-wrapper">

      <table>

        <thead id="status-head">

          <tr>

            <th>참가자</th>

            <th>참가번호</th>

            <th>제출 여부</th>

            <th>제출 답안</th>

            <th>정답 여부</th>

            <th>이번 점수</th>

            <th>누적 점수</th>

          </tr>

        </thead>


        <tbody id="status-body">
        </tbody>

      </table>

    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js"></script>

  <script src="admin.js"></script>

</body>

</html>
